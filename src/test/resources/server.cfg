# run --> ./gradlew runHttpServerTest -Pargs=src/test/resources/server.cfg
keepAlive: 120s
maxWorkers: 1000
queueTime: 50MS
acceptors:
 - port: 8443
   backlog: 10000
   deferAccept: true
   ssl:
     applicationProtocols: http/1.1
     protocols:            TLSv1+TLSv1.1+TLSv1.2+TLSv1.3
     certFile:             /etc/ssl/my.crt
     privateKeyFile:       /etc/ssl/my.key
     timeout:              12H
     debug:                true