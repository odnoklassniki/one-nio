status = warn

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level [%t] %logger{36} - %msg%n

rootLogger.level = debug
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = Console

logger.httpServerTest.name = one.nio.http.HttpServerTest
logger.httpServerTest.level = trace
logger.httpServerTest.additivity = false
logger.httpServerTest.appenderRefs = console
logger.httpServerTest.appenderRef.console.ref = Console